# 服务配置
server:
  port: 21090
  servlet:
    context-path: /api/v1.0/pet-adopt-api
# API地址前缀，用于接口拦截放行
my-server:
  api-context-path: /api/v1.0/pet-adopt-api
#MySQL与文件上传限制配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_adoption?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  redis:
    host: localhost                    # Redis服务器地址
    port: 6379                         # Redis端口
#    password: 1234                     # 如果Docker启动Redis时设置了密码，这里需要填写
    database: 0                        # 默认数据库索引
    timeout: 3000ms                    # 连接超时时间
    lettuce:
      pool:
        max-active: 20                 # 连接池最大连接数
        max-idle: 10                   # 连接池最大空闲连接数
        min-idle: 5                    # 连接池最小空闲连接数
        max-wait: -1ms                 # 连接池最大阻塞等待时间（-1表示无限制）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启日志
      map-underscore-to-camel-case: true # 开启驼峰命名
    global-config:
      db-config:
        id-type: auto # 主键策略
    mapper-locations: classpath*:/mapper/**/*.xml # mapper文件位置


